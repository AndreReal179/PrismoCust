<style>
:root{
  --bg:#070a11; --bg2:#0d121c; --card:#131925; --card2:#1a2232; --line:#232d44; --line2:#2e3a57;
  --txt:#e9eef9; --mut:#8f9cb8; --blue:#2f7bff; --cyan:#2dd4ff; --green:#22c55e; --red:#f05252; --amber:#f5a524;
  --r:16px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:#02050c;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:100%;height:100%;object-fit:cover;object-position:center;animation:zoomin 5.2s ease-out both}
#splash .bar{position:absolute;left:12%;right:12%;bottom:calc(5% + var(--safe-b));height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 12px var(--cyan);animation:load 5s linear forwards}
@keyframes load{to{width:100%}}
@keyframes zoomin{from{transform:scale(1.04)}to{transform:scale(1)}}

/* ---------- layout ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(1200px 500px at 50% -10%,#0f1c3a 0%,transparent 60%),var(--bg)}
header.top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--line);background:rgba(7,10,17,.85);backdrop-filter:blur(10px);z-index:5}
header.top h1{font-size:17px;font-weight:700;flex:1;letter-spacing:.2px}
header.top img{width:34px;height:34px;border-radius:9px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:.15s}
.icon-btn:active{transform:scale(.94);background:var(--card2)}
.icon-btn svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 14px calc(96px + var(--safe-b));scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.view{max-width:760px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- componentes ---------- */
.card{background:linear-gradient(180deg,var(--card),#10151f);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h2 svg{width:20px;height:20px;color:var(--cyan)}
.card .sub{color:var(--mut);font-size:13px;margin:-6px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label{font-size:12.5px;color:var(--mut);font-weight:600;letter-spacing:.2px}
.field .hint{font-size:11.5px;color:var(--mut)}
.field .hint.est{color:var(--amber)}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;background:#0b1019;border:1px solid var(--line2);border-radius:12px;padding:12px 13px;outline:none;min-height:46px;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.22)}
textarea{min-height:70px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 14px) 20px;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.affix{position:relative}
.affix input{padding-right:46px}
.affix span{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;pointer-events:none}
.affix.pre input{padding-left:38px;padding-right:13px}
.affix.pre span{left:13px;right:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;min-height:48px;transition:.15s;background:var(--card2);border:1px solid var(--line2)}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px}
.btn.primary{background:linear-gradient(135deg,#2f7bff,#1fa8ff);border-color:transparent;color:#fff;box-shadow:0 6px 22px rgba(47,123,255,.35)}
.btn.green{background:linear-gradient(135deg,#17a34a,#22c55e);border-color:transparent;color:#04130a}
.btn.danger{color:#ff9a9a;border-color:#4a2330;background:#1c1117}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13px;border-radius:11px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#16233f;color:var(--cyan);border:1px solid #223a66}
.badge.g{background:#0f2a1b;color:#4ade80;border-color:#1b4a30}
.badge.r{background:#2b1218;color:#ff8d8d;border-color:#5a2230}
.badge.a{background:#2a2110;color:#fbbf24;border-color:#57420f}
.pos{color:var(--green)} .neg{color:var(--red)}
.muted{color:var(--mut)}
.empty{text-align:center;padding:26px 14px;color:var(--mut)}
.empty img{width:120px;height:120px;border-radius:28px;margin-bottom:12px;box-shadow:0 0 40px rgba(47,123,255,.35)}
.empty h3{color:var(--txt);margin-bottom:6px;font-size:16px}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);vertical-align:-3px;margin-right:8px;flex:none}
.alert{border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:12px;border:1px solid}
.alert.err{background:#2a1218;border-color:#5a2230;color:#ffb3b3}
.alert.warn{background:#2a2110;border-color:#57420f;color:#fcd34d}
.alert.ok{background:#0f2a1b;border-color:#1b4a30;color:#86efac}
.alert ul{margin:6px 0 0;padding-left:18px}

/* listas de cadastro */
.item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);margin-bottom:8px}
.item .meta{flex:1;min-width:0}
.item .meta b{display:flex;align-items:center;font-size:14.5px}
.item .meta b span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta small{color:var(--mut);display:block;margin-top:2px}
.item .meta .cost{color:var(--cyan);font-weight:700}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;margin-bottom:14px;border:1px solid #1d3a73;background:linear-gradient(135deg,#0c1a3a 0%,#0a1224 55%,#0b2b46 100%)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,255,.35),transparent 65%)}
.hero h2{font-size:24px;font-weight:800;margin-bottom:4px;position:relative}
.hero p{color:#a8b8d9;margin-bottom:16px;position:relative}
.hero .btn{position:relative}
.stat{padding:14px}
.stat small{color:var(--mut);font-size:12px;font-weight:600;display:block;margin-bottom:6px}
.stat b{font-size:20px;display:block;word-break:break-word}
.stat.wide{grid-column:1/-1}
.quick{display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px;text-align:left;width:100%}
.quick svg{width:26px;height:26px;color:var(--cyan)}
.quick b{display:block}.quick small{color:var(--mut)}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:.25s;z-index:40}
#scrim.on{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:linear-gradient(180deg,#0e1524,#080c15);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:50;display:flex;flex-direction:column;padding-top:var(--safe-t)}
#drawer.on{transform:none;box-shadow:12px 0 50px rgba(0,0,0,.6)}
#drawer .brand{display:flex;align-items:center;gap:12px;padding:18px 16px;border-bottom:1px solid var(--line)}
#drawer .brand img{width:46px;height:46px;border-radius:12px}
#drawer .brand b{display:block;font-size:16px}#drawer .brand small{color:var(--mut)}
#drawer nav{flex:1;padding:10px;overflow-y:auto}
#drawer nav a{display:flex;align-items:center;gap:14px;padding:14px;border-radius:13px;color:var(--txt);text-decoration:none;font-weight:600;margin-bottom:4px;cursor:pointer}
#drawer nav a svg{width:22px;height:22px;color:var(--mut)}
#drawer nav a.on{background:linear-gradient(90deg,rgba(47,123,255,.25),rgba(47,123,255,.05));color:#fff}
#drawer nav a.on svg{color:var(--cyan)}
#drawer .foot{padding:16px calc(16px) calc(16px + var(--safe-b));border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
#drawer .foot b{color:var(--txt);display:block;font-size:15px;margin-bottom:2px}

/* ---------- calc ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -14px 4px;padding-left:14px;padding-right:14px;scrollbar-width:none;position:sticky;top:-16px;background:linear-gradient(var(--bg) 80%,transparent);z-index:3;padding-top:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:99px;border:1px solid var(--line2);background:var(--card);color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tab i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--card2);font-size:11px}
.tab.on{background:linear-gradient(135deg,#2f7bff,#1fa8ff);color:#fff;border-color:transparent}
.tab.on i{background:rgba(255,255,255,.25)}
.line-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg2);margin-bottom:10px}
.line-card .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.line-card .head b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-total{display:flex;justify-content:space-between;align-items:center;margin-top:2px;color:var(--mut);font-size:13px}
.line-total b{color:var(--cyan);font-size:15px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + var(--safe-b));background:rgba(7,10,17,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock .sum{flex:1;min-width:0}
.dock small{color:var(--mut);font-size:11.5px;display:block}
.dock b{font-size:17px}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{border-radius:16px;padding:14px;border:1px solid var(--line);background:var(--card)}
.kpi small{display:block;color:var(--mut);font-size:12px;font-weight:600;margin-bottom:4px}
.kpi.main{background:linear-gradient(135deg,#0f2a5c,#0b1c3d);border-color:#245099}
.kpi.mainb{background:linear-gradient(135deg,#0f3a46,#0b2a35);border-color:#1c6f86}
.comp{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px}
.comp:last-child{border:0}
.comp .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px}
.comp small{color:var(--mut);display:block;font-size:11.5px}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;margin:6px 0 14px}
.donut-wrap svg{width:170px;height:170px;flex:none}
.tbl-wrap{overflow-x:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{padding:9px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#111723}
tr.loss td{background:rgba(240,82,82,.08)}
.bars .b{margin-bottom:12px}
.bars .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:8px}
.bars .track{height:10px;border-radius:6px;background:#0b1019;overflow:hidden;display:flex;gap:2px}
.bars .track i{display:block;height:100%}
.faixa{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:8px;align-items:end;margin-bottom:8px}
.faixa .field{margin:0}
.hist-top{display:flex;gap:8px;margin-bottom:12px}
.hist-top>*{min-width:0}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fadebg .2s}
@keyframes fadebg{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#141b2a,#0d121c);border:1px solid var(--line2);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--safe-b));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:17px;margin-bottom:14px}
.sheet .grip{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:-8px auto 14px}
@media(min-width:600px){.modal-bg{align-items:center}.sheet{border-radius:22px}}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.colors button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.colors button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(47,123,255,.6)}
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:#0f2a1b;border:1px solid #1f6b43;color:#d1fae5;padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#2a1218;border-color:#6b2331;color:#fecaca}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right}
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:460px;margin:0 auto;padding:10px 0}
.welcome img{width:150px;height:150px;border-radius:34px;margin:0 auto 20px;display:block;box-shadow:0 0 60px rgba(47,123,255,.5)}
.welcome h1{font-size:26px;text-align:center;margin-bottom:10px}
.welcome p{color:var(--mut);text-align:center;margin-bottom:22px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>/* PrismoLab 3D Cost — motor de cálculo e persistência (independente de interface) */
(function (root) {
  'use strict';

  const EPS = 1e-9;
  const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  // arredondamento monetário (meio para cima, tolerante a erro binário)
  const r2 = (v) => { const n = num(v); return (n < 0 ? -1 : 1) * Math.round((Math.abs(n) + 1e-9) * 100) / 100; };

  // Converte texto brasileiro ("1.234,56", "0,09", "0.09") em número. NaN se inválido.
  function parseBR(s) {
    if (typeof s === 'number') return Number.isFinite(s) ? s : NaN;
    s = String(s == null ? '' : s).trim().replace(/\s/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    const n = Number(s);
    return Number.isFinite(n) ? n : NaN;
  }

  /* ---------- fórmulas básicas ---------- */
  const custoPorGrama = (preco, peso) => (num(peso) > 0 && num(preco) >= 0 ? num(preco) / num(peso) : 0);
  const custoUnitarioCompra = (total, qtd) => (num(qtd) > 0 && num(total) >= 0 ? num(total) / num(qtd) : 0);
  const horasTotais = (h, m) => num(h) + num(m) / 60;
  const energia = (watts, horas, kwh) => (num(watts) / 1000) * num(horas) * num(kwh);
  const desgaste = (horas, valorHora) => num(horas) * num(valorHora);
  const maoDeObra = (minutos, valorHora) => (num(minutos) / 60) * num(valorHora);
  const custoFilamento = (gramas, cg) => num(gramas) * num(cg);
  const comPerdas = (custo, pct) => num(custo) * (1 + num(pct) / 100);

  /* ---------- custo do lote ---------- */
  function calcularLote(c) {
    const erros = [];
    const prod = num(c.produzidas), apr = num(c.aproveitadas);
    const horas = horasTotais(c.horas, c.minutos);

    if (!(horas > 0)) erros.push('Informe o tempo de impressão (horas e/ou minutos).');
    if (!(prod > 0) || !Number.isInteger(prod)) erros.push('A quantidade produzida deve ser um número inteiro maior que zero.');
    if (!(apr > 0) || !Number.isInteger(apr)) erros.push('A quantidade aproveitada deve ser um número inteiro maior que zero.');
    else if (apr > prod) erros.push('A quantidade aproveitada não pode exceder a quantidade produzida.');

    const fils = c.filamentos || [], accs = c.acessorios || [], embs = c.embalagens || [];
    const numericos = [c.horas, c.minutos, c.perdasPct, c.watts, c.kwh, c.desgasteHora, c.maoMin, c.maoHora, c.outrosLote, c.fixosPeca]
      .concat(fils.map(f => f.gramas), accs.map(a => a.qtd), embs.map(e => e.qtdEmb));
    if (numericos.some(v => num(v) < 0)) erros.push('Valores negativos não são permitidos.');
    if (!fils.some(f => num(f.gramas) > 0)) erros.push('Adicione ao menos um filamento com peso consumido maior que zero.');
    if (embs.some(e => !(num(e.pecasAtendidas) > 0))) erros.push('Em cada embalagem, as peças atendidas devem ser maiores que zero.');

    const filamentos = fils.reduce((s, f) => s + custoFilamento(f.gramas, f.custoGrama), 0);
    const filamentosComPerdas = comPerdas(filamentos, c.perdasPct);
    const perdas = filamentosComPerdas - filamentos;
    const en = energia(c.watts, horas, c.kwh);
    const des = desgaste(horas, c.desgasteHora);
    const aproveit = apr > 0 ? apr : 0;
    const acessorios = accs.reduce((s, a) => s + num(a.custoUnit) * num(a.qtd), 0) * aproveit;
    const embalagens = embs.reduce((s, e) => s + (num(e.pecasAtendidas) > 0 ? num(e.custoUnit) * num(e.qtdEmb) / num(e.pecasAtendidas) : 0), 0) * aproveit;
    const mao = maoDeObra(c.maoMin, c.maoHora);
    const outros = num(c.outrosLote);
    const fixos = num(c.fixosPeca) * aproveit;

    const total = filamentosComPerdas + en + des + acessorios + embalagens + mao + outros + fixos;
    const unit = apr > 0 ? total / apr : 0;

    return {
      ok: erros.length === 0, erros, horas,
      produzidas: prod, aproveitadas: apr,
      filamentos, perdas, filamentosComPerdas, energia: en, desgaste: des,
      acessorios, embalagens, maoDeObra: mao, outros, fixos,
      total, unit,
    };
  }

  /* ---------- precificação ---------- */
  function precoVenda(custoUnit, margem, taxa, imposto) {
    const m = num(margem), t = num(taxa), i = num(imposto);
    if (m < 0 || t < 0 || i < 0) return { erro: 'Margem, taxas e impostos não podem ser negativos.' };
    const soma = m + t + i;
    if (soma >= 100) return { erro: 'Margem + taxas + impostos somam ' + soma.toFixed(1).replace('.', ',') + '%. A soma precisa ser menor que 100% para o preço existir.' };
    return { preco: num(custoUnit) / (1 - soma / 100) };
  }

  function precoMinimo(custoUnit, taxa, imposto) {
    const soma = num(taxa) + num(imposto);
    return soma >= 100 ? Infinity : num(custoUnit) / (1 - soma / 100);
  }

  function analisarPreco(custoUnit, preco, taxa, imposto, qtd) {
    const q = num(qtd);
    const taxaUn = preco * num(taxa) / 100;
    const impUn = preco * num(imposto) / 100;
    const lucroUn = preco - num(custoUnit) - taxaUn - impUn;
    const minimo = precoMinimo(custoUnit, taxa, imposto);
    return {
      qtd: q, preco, taxaUn, impUn, lucroUn,
      margemEfetiva: preco > 0 ? (lucroUn / preco) * 100 : 0,
      totalPedido: preco * q, custoTotal: num(custoUnit) * q,
      taxasTotal: taxaUn * q, impostosTotal: impUn * q, lucroTotal: lucroUn * q,
      prejuizo: preco + EPS < minimo, precoMinimo: minimo,
    };
  }

  function varejo(custoUnit, est, qtdVendida) {
    const p = precoVenda(custoUnit, est.margemVarejo, est.taxa, est.imposto);
    if (p.erro) return { erro: p.erro };
    return analisarPreco(custoUnit, p.preco, est.taxa, est.imposto, qtdVendida || 1);
  }

  // faixa: {qtd, margem ('' = usa margem de atacado), desconto ('' = sem desconto)}
  function atacado(custoUnit, est) {
    return (est.faixas || []).map((f) => {
      const qtd = Math.floor(num(f.qtd));
      if (!(qtd > 0)) return { qtd: 0, erro: 'Quantidade da faixa inválida.' };
      const margem = f.margem === '' || f.margem == null ? est.margemAtacado : f.margem;
      const desc = f.desconto === '' || f.desconto == null ? 0 : num(f.desconto);
      if (desc < 0 || desc >= 100) return { qtd, erro: 'Desconto deve estar entre 0 e 100%.' };
      const base = precoVenda(custoUnit, margem, est.taxa, est.imposto);
      if (base.erro) return { qtd, erro: base.erro };
      const preco = base.preco * (1 - desc / 100);
      return Object.assign(analisarPreco(custoUnit, preco, est.taxa, est.imposto, qtd), { margemConfigurada: num(margem), desconto: desc });
    });
  }

  // Comparação neutra: não elege "melhor" por volume; só sinaliza métricas objetivas entre linhas sem prejuízo.
  function comparar(custoUnit, est) {
    const linhas = [];
    const v = varejo(custoUnit, est, 1);
    if (!v.erro) linhas.push(Object.assign({ rotulo: 'Venda unitária' }, v));
    atacado(custoUnit, est).forEach((a) => { if (!a.erro) linhas.push(Object.assign({ rotulo: 'Lote de ' + a.qtd }, a)); });
    const ok = linhas.filter((l) => !l.prejuizo);
    const argmax = (fn) => ok.reduce((b, l) => (b === null || fn(l) > fn(b) + EPS ? l : b), null);
    const argmin = (fn) => ok.reduce((b, l) => (b === null || fn(l) < fn(b) - EPS ? l : b), null);
    return {
      linhas,
      maiorLucroTotal: argmax((l) => l.lucroTotal),
      maiorLucroUnitario: argmax((l) => l.lucroUn),
      maiorMargem: argmax((l) => l.margemEfetiva),
      menorPreco: argmin((l) => l.preco),
    };
  }

  /* ---------- histórico e persistência ---------- */
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // O snapshot guarda cópias dos custos do momento; editar cadastros depois não o altera.
  function snapshotCalculo(calc, resultado, varejoRes, atacadoRes, agora) {
    return {
      id: calc.id,
      data: (agora || new Date()).toISOString(),
      calc: clone(calc),
      resultado: clone(resultado),
      varejo: clone(varejoRes),
      atacado: clone(atacadoRes),
    };
  }

  function criarStore(storage, key, padrao) {
    return {
      carregar() {
        try { const s = storage.getItem(key); if (s) return JSON.parse(s); } catch (e) { /* ignora */ }
        return padrao();
      },
      salvar(estado) {
        try { storage.setItem(key, JSON.stringify(estado)); return true; } catch (e) { return false; }
      },
    };
  }

  const api = {
    r2, num, parseBR, custoPorGrama, custoUnitarioCompra, horasTotais, energia, desgaste, maoDeObra,
    custoFilamento, comPerdas, calcularLote, precoVenda, precoMinimo, analisarPreco, varejo, atacado,
    comparar, snapshotCalculo, criarStore, clone,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Engine = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
(function(){
'use strict';
const E = window.Engine;
const VERSION = '1.0.0';

      inner = '<input type="text" data-k="' + f.k + '" data-t="' + f.type + '" ' + (num ? 'inputmode="' + (f.type === 'int' ? 'numeric' : 'decimal') + '"' : '') + ' value="' + esc(num ? toInput(v[f.k]) : v[f.k] || '') + '" placeholder="' + esc(f.ph || '') + '" autocomplete="off">';
      if (f.unit) inner = '<div class="affix">' + inner + '<span>' + f.unit + '</span></div>';
      if (f.pre) inner = '<div class="affix pre">' + inner + '<span>' + f.pre + '</span></div>';
    }
    return '<div class="field"><label>' + f.label + '</label>' + inner + (f.hint ? '<div class="hint' + (f.est ? ' est' : '') + '">' + f.hint + '</div>' : '') + '</div>';
  };
  const root = $('#modalRoot');
  root.innerHTML = '<div class="modal-bg"><div class="sheet"><div class="grip"></div><h3>' + esc(o.title) + '</h3><div id="fErr"></div>' +
    o.fields.map(fieldHtml).join('') + (o.preview ? '<div class="alert ok" id="fPrev"></div>' : '') +
    '<div class="row"><button class="btn block" data-act="x">Cancelar</button><button class="btn primary block" data-act="ok">Salvar</button></div></div></div>';
  const upd = () => { if (o.preview) $('#fPrev').innerHTML = o.preview(v); };
  upd();
  root.oninput = (e) => {
    const el = e.target; const k = el.dataset.k; if (!k) return;
    if (el.dataset.t === 'num' || el.dataset.t === 'int') {
      let s = el.value.replace(el.dataset.t === 'int' ? /\D/g : /[^\d.,]/g, ''); if (s !== el.value) el.value = s;

    const a = e.target.closest('[data-act]');

function handleCalcClick(e) {

    if (t.dataset.add === 'acc') { calc.acessorios.push({ aid: '', nome: '', custoUnit: null, qtd: 1 }); }
    if (t.dataset.add === 'emb') { calc.embalagens.push({ eid: '', nome: '', custoUnit: null, qtdEmb: 1, pecasAtendidas: 1 }); }

document.addEventListener('input', (e) => {

    const n = E.parseBR(s); v = Number.isNaN(n) ? '' : (type === 'int' ? Math.floor(n) : n);
  }
  const parts = p.split('.'); const rootKey = parts.shift();
  let obj = rootKey === 'calc' ? calc : rootKey === 'cfg' ? S.cfg : S;
  while (parts.length > 1) obj = obj[parts.shift()];

function donut(r) {
  const parts = COMP.map((c) => ({ v: Math.max(0, r[c[0]]), c: c[2] })).filter((p) => p.v > 0); const tot = parts.reduce((s, p) => s + p.v, 0);
  if (!(tot > 0)) return '';
  let off = 0; const R = 15.9155;
  const segs = parts.map((p) => { const len = p.v / tot * 100; const s = '<circle r="' + R + '" cx="21" cy="21" fill="none" stroke="' + p.c + '" stroke-width="6" stroke-dasharray="' + len.toFixed(3) + ' ' + (100 - len).toFixed(3) + '" stroke-dashoffset="' + (-off).toFixed(3) + '"/>'; off += len; return s; }).join('');
  return '<svg viewBox="0 0 42 42" role="img" aria-label="Composição de custos"><circle r="' + R + '" cx="21" cy="21" fill="none" stroke="#0b1019" stroke-width="6"/><g transform="rotate(-90 21 21)">' + segs + '</g><text x="21" y="20" text-anchor="middle" font-size="3.4" fill="#8f9cb8">custo total</text><text x="21" y="25.5" text-anchor="middle" font-size="4.6" font-weight="700" fill="#e9eef9">' + brl(r.total).replace('R$', 'R$') + '</text></svg>';
}

    const tag = (l) => [cmp.maiorLucroTotal === l ? '<span class="badge g">maior lucro total</span>' : '', cmp.maiorLucroUnitario === l ? '<span class="badge">maior lucro/un</span>' : '', cmp.menorPreco === l ? '<span class="badge a">menor preço</span>' : '', cmp.maiorMargem === l ? '<span class="badge g">maior margem</span>' : '', l.prejuizo ? '<span class="badge r">prejuízo</span>' : ''].join(' ');
    h += '<div class="card"><h2>' + ico('chart') + 'Simulação comparativa</h2><div class="sub">Compare preço (azul) e lucro por unidade (verde/vermelho). Volume maior não é automaticamente melhor — veja lucro total, margem e preço.</div><div class="bars">' +
      cmp.linhas.map((l) => '<div class="b"><div class="lab"><b>' + l.rotulo + '</b><span class="num muted">lucro total ' + brl(l.lucroTotal) + ' · margem ' + pct(l.margemEfetiva) + '</span></div><div class="track" title="Preço"><i style="width:' + (l.preco / maxP * 100).toFixed(1) + '%;background:var(--blue)"></i></div><div class="track" style="margin-top:3px;background:#0b1019" title="Lucro por unidade"><i style="width:' + (Math.abs(l.lucroUn) / maxL * 100).toFixed(1) + '%;background:' + (l.lucroUn >= 0 ? 'var(--green)' : 'var(--red)') + '"></i></div><div class="lab" style="margin:5px 0 0"><span class="num">' + brl(l.preco) + ' / un</span><span class="num ' + (l.lucroUn >= 0 ? 'pos' : 'neg') + '">' + brl(l.lucroUn) + ' lucro/un</span></div><div style="margin-top:5px">' + tag(l) + '</div></div>').join('') + '</div></div>';
  }
  box.innerHTML = h;
}

function salvarCalculo() {
  const { r, vr, at } = curCalcResult();
  const errs = r.erros.slice(); if (!String(calc.nome || '').trim()) errs.unshift('Informe o nome do produto na aba Impressão.');
  if (errs.length) { toast(errs[0], true); return; }
  if (vr && vr.erro) { toast('Corrija a estratégia de venda: ' + vr.erro, true); return; }
  const snap = E.snapshotCalculo(Object.assign({}, calc, { dirty: undefined, nome: calc.nome.trim() }), r, vr, at);
  const i = S.hist.findIndex((h) => h.id === snap.id);
  if (i >= 0) S.hist[i] = snap; else S.hist.unshift(snap);
  calc.dirty = false; save(true); toast('Cálculo salvo no histórico ✔');
}

/* =========================================================
   Histórico
========================================================= */
let hf = { q: '', per: 'all', de: '', ate: '' };
function viewHist(v) {
  v.innerHTML = '<div class="card"><div class="field" style="margin-bottom:10px"><input type="search" id="hq" placeholder="Pesquisar por nome do produto" value="' + esc(hf.q) + '"></div><div class="grid2"><div class="field" style="margin:0"><select id="hp"><option value="all">Todo o período</option><option value="hoje">Hoje</option><option value="7">Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="custom">Personalizado…</option></select></div><div class="field" style="margin:0"><button class="btn sm block" id="hclear" style="min-height:46px">Limpar filtros</button></div></div><div id="hcustom" class="grid2" style="margin-top:10px;display:none"><input type="date" id="hde" value="' + hf.de + '"><input type="date" id="hate" value="' + hf.ate + '"></div></div><div id="hlist"></div>';
  $('#hp').value = hf.per; if (hf.per === 'custom') $('#hcustom').style.display = '';
  const list = () => {
    const now = new Date(); const q = hf.q.trim().toLowerCase();
    let items = S.hist.filter((h) => !q || (h.calc.nome || '').toLowerCase().includes(q));
    const t = (h) => new Date(h.data).getTime(); const day = 864e5; const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (hf.per === 'hoje') items = items.filter((h) => t(h) >= start);
    if (hf.per === '7') items = items.filter((h) => t(h) >= start - 6 * day);
    if (hf.per === '30') items = items.filter((h) => t(h) >= start - 29 * day);
    if (hf.per === 'custom') { if (hf.de) items = items.filter((h) => t(h) >= new Date(hf.de + 'T00:00:00').getTime()); if (hf.ate) items = items.filter((h) => t(h) <= new Date(hf.ate + 'T23:59:59').getTime()); }
    $('#hlist').innerHTML = items.length ? items.map((h) => '<div class="card"><div class="row" style="margin-bottom:8px"><div style="flex:1;min-width:0"><b style="font-size:16px">' + esc(h.calc.nome || 'Sem nome') + '</b><div class="muted" style="font-size:12px">' + fmtDate(h.data) + ' · ' + h.resultado.aproveitadas + ' peça' + (h.resultado.aproveitadas > 1 ? 's' : '') + ' · ' + fmtTempo(h.resultado.horas) + '</div></div></div><div class="grid2" style="margin-bottom:12px"><div><small class="muted">Custo por peça</small><div class="num" style="font-weight:800;font-size:18px">' + brl(h.resultado.unit) + '</div></div><div><small class="muted">Varejo sugerido</small><div class="num pos" style="font-weight:800;font-size:18px">' + (h.varejo && !h.varejo.erro ? brl(h.varejo.preco) : '—') + '</div></div></div><div class="row wrap"><button class="btn sm" data-h="ver:' + h.id + '">' + ico('eye') + 'Ver</button><button class="btn sm" data-h="dup:' + h.id + '">' + ico('copy') + 'Duplicar</button><button class="btn sm" data-h="edit:' + h.id + '">' + ico('edit') + 'Editar como novo</button><button class="btn sm danger" data-h="del:' + h.id + '">' + ico('trash') + 'Excluir</button></div></div>').join('') :
      '<div class="card empty"><img src="' + LOGO + '" alt=""><h3>' + (S.hist.length ? 'Nada encontrado' : 'Seu histórico está vazio') + '</h3><p>' + (S.hist.length ? 'Ajuste a pesquisa ou o período.' : 'Os cálculos que você salvar aparecem aqui.') + '</p>' + (S.hist.length ? '' : '<button class="btn primary" data-go="calc" style="margin-top:12px">Nova impressão</button>') + '</div>';
  };
  list();
  $('#hq').oninput = (e) => { hf.q = e.target.value; list(); };
  $('#hp').onchange = (e) => { hf.per = e.target.value; $('#hcustom').style.display = hf.per === 'custom' ? '' : 'none'; list(); };
  $('#hde').onchange = (e) => { hf.de = e.target.value; list(); }; $('#hate').onchange = (e) => { hf.ate = e.target.value; list(); };
  $('#hclear').onclick = () => { hf = { q: '', per: 'all', de: '', ate: '' }; viewHist(v); };
  v.onclick = async (e) => {
    const g = e.target.closest('[data-go]'); if (g) { novoCalc(); go('calc'); return; }
    const b = e.target.closest('[data-h]'); if (!b) return; const [a, id] = b.dataset.h.split(':'); const h = S.hist.find((x) => x.id === id); if (!h) return;
    if (a === 'ver') return verHist(h);
    if (a === 'dup') { const c = clone(h); c.id = uid(); c.data = new Date().toISOString(); c.calc.id = c.id; c.calc.nome = (c.calc.nome || 'Sem nome') + ' (cópia)'; S.hist.unshift(c); save(true); toast('Cálculo duplicado.'); list(); return; }
    if (a === 'edit') { novoCalc(h.calc); calc.nome = h.calc.nome; calcTab = 0; go('calc'); toast('Aberto como novo cálculo. O original não será alterado.'); return; }
    if (a === 'del' && await confirmar('Excluir o cálculo "' + (h.calc.nome || 'Sem nome') + '"?')) { S.hist = S.hist.filter((x) => x.id !== id); save(true); toast('Cálculo excluído.'); list(); }
  };
}
function verHist(h) {
  const r = h.resultado, c = h.calc, vr = h.varejo;
  const kv = (a, b) => '<div class="kv"><span>' + a + '</span><span class="num">' + b + '</span></div>';
  $('#modalRoot').innerHTML = '<div class="modal-bg"><div class="sheet"><div class="grip"></div><div class="row"><h3 style="flex:1;margin:0">' + esc(c.nome || 'Sem nome') + '</h3><button class="icon-btn" data-x aria-label="Fechar">' + ico('x') + '</button></div><div class="muted" style="font-size:12px;margin:4px 0 12px">' + fmtDate(h.data) + ' · ' + esc(c.impressora || '') + '</div>' +
    (c.descricao ? '<p class="muted" style="margin-bottom:10px">' + esc(c.descricao) + '</p>' : '') +
    '<div class="kpis"><div class="kpi main"><small>Custo do lote</small><b class="num" style="font-size:20px">' + brl(r.total) + '</b></div><div class="kpi mainb"><small>Custo por peça</small><b class="num" style="font-size:20px">' + brl(r.unit) + '</b></div></div>' +
    '<h3 style="font-size:14px;margin:8px 0">Materiais (custos da época)</h3>' + (c.filamentos.map((f) => kv(esc(f.nome) + ' — ' + nf1.format(E.num(f.gramas)) + ' g × ' + brl4(f.custoGrama), brl(E.custoFilamento(f.gramas, f.custoGrama)))).join('')) +
    kv('Perdas (' + pct(c.perdasPct) + ')', brl(r.perdas)) +
    (c.acessorios.length ? c.acessorios.map((a) => kv(esc(a.nome) + ' — ' + nf1.format(E.num(a.qtd)) + ' × ' + brl4(a.custoUnit) + ' /peça', brl(E.num(a.custoUnit) * E.num(a.qtd) * r.aproveitadas))).join('') : '') +
    (c.embalagens.length ? c.embalagens.map((a) => kv(esc(a.nome) + ' — ' + nf1.format(E.num(a.qtdEmb)) + ' p/ ' + nf0.format(E.num(a.pecasAtendidas)) + ' peça(s)', brl(E.num(a.custoUnit) * E.num(a.qtdEmb) / E.num(a.pecasAtendidas) * r.aproveitadas))).join('') : '') +
    '<h3 style="font-size:14px;margin:12px 0 8px">Composição</h3>' + kv('Energia (' + nf0.format(c.watts) + ' W · ' + brl(c.kwh) + '/kWh)', brl(r.energia)) + kv('Desgaste (' + brl(c.desgasteHora) + '/h)', brl(r.desgaste)) + kv('Mão de obra', brl(r.maoDeObra)) + kv('Outros custos diretos', brl(r.outros)) + kv('Custos fixos rateados', brl(r.fixos)) + kv('Tempo de impressão', fmtTempo(r.horas)) + kv('Produzidas / aproveitadas', r.produzidas + ' / ' + r.aproveitadas) +
    '<h3 style="font-size:14px;margin:12px 0 8px">Venda</h3>' + kv('Taxa · Imposto', pct(c.est.taxa) + ' · ' + pct(c.est.imposto)) +
    (vr && !vr.erro ? kv('Varejo sugerido (margem ' + pct(c.est.margemVarejo) + ')', '<b class="pos">' + brl(vr.preco) + '</b>') + kv('Lucro por unidade', brl(vr.lucroUn)) + kv('Margem efetiva', pct(vr.margemEfetiva)) : '') +
    (h.atacado || []).filter((a) => !a.erro).map((a) => kv('Atacado ' + a.qtd + ' un — ' + brl(a.preco) + '/un' + (a.prejuizo ? ' ⚠ prejuízo' : ''), 'lucro ' + brl(a.lucroTotal))).join('') +
    '<button class="btn block" data-x style="margin-top:16px">Fechar</button></div></div>';
  $('#modalRoot').onclick = (e) => { if (e.target.closest('[data-x]') || e.target.classList.contains('modal-bg')) closeModal(); };
}

/* =========================================================
   Sobre
========================================================= */
function viewSobre(v) {
  v.innerHTML = '<div class="card" style="text-align:center"><img src="' + LOGO + '" alt="" style="width:130px;height:130px;border-radius:30px;box-shadow:0 0 50px rgba(47,123,255,.45);margin-bottom:12px"><h2 style="justify-content:center;font-size:20px">PrismoLab 3D Cost</h2><p class="muted">Precificação profissional de impressões 3D · Versão ' + VERSION + '</p></div>' +
    '<div class="card"><h2>' + ico('info') + 'Como o app calcula</h2><div class="kv"><span>Filamento</span><span>g × (preço do rolo ÷ peso)</span></div><div class="kv"><span>Perdas</span><span>só sobre filamentos</span></div><div class="kv"><span>Energia</span><span>(W ÷ 1.000) × h × R$/kWh</span></div><div class="kv"><span>Desgaste</span><span>h × R$/h</span></div><div class="kv"><span>Custo por peça</span><span>total do lote ÷ aproveitadas</span></div><div class="kv"><span>Preço de venda</span><span>custo ÷ [1 − (margem+taxa+imposto)]</span></div></div>' +
    '<div class="card"><h2>' + ico('save') + 'Seus dados</h2><p class="muted">Funciona 100% offline, sem login. Tudo fica salvo neste aparelho. Use o backup em Configurações para guardar uma cópia. Margens, taxas e impostos iniciais são estimativas editáveis, não orientação tributária.</p></div>';
}

/* =========================================================
   Inicialização + splash de 5 segundos
========================================================= */
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){});
if (!location.hash) history.replaceState(null, '', '#/home');
$('#app').hidden = false; render();
setTimeout(() => { const s = $('#splash'); s.classList.add('out'); setTimeout(() => s.remove(), 700); }, SPLASH_MS);
window.__PL = { get S() { return S; }, get calc() { return calc; }, novoCalc, render };
})();
</script>
